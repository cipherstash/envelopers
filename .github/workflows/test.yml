name: "Test"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    runs-on: ubuntu-latest
    name: "🧪 Test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install minimal nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: "Test"
        run: |
          cargo test

      - name: "Check no default"
        run : |
          cargo check --no-default-features

  bench:
    runs-on: ubuntu-latest
    name: "⏱ Benchmark"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install minimal nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: "Benchmark"
        run: |
          cargo bench
