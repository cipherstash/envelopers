name: "Release-plz"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether this push merged a release PR. Only then does the release
  # job run and ask the release environment's reviewers for approval; other
  # pushes to main skip it without creating a pending deployment.
  release-gate:
    name: "Release-plz release gate"
    # workflow_dispatch is excluded: publishing must follow a merged release PR.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'cipherstash/envelopers'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.check.outputs.release }}

    steps:
      - name: Check for a merged release PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # The commit-to-PR association can lag the push briefly, so retry
          # while GitHub reports no PR for the commit at all.
          for _ in 1 2 3; do
            prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls")"
            if [[ "$(jq length <<<"$prs")" -gt 0 ]]; then
              break
            fi
            sleep 10
          done
          release="$(jq '[.[] | select(
            .merged_at != null and
            .base.ref == "main" and
            .head.repo.full_name == "cipherstash/envelopers" and
            (.head.ref | startswith("release-plz-")) and
            .user.login == "cipherstash-envelopers-release-plz[bot]"
          )] | length > 0' <<<"$prs")"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    name: "Release-plz release"
    needs: release-gate
    # The push guard is repeated so the release job stays safe on its own.
    if: >-
      needs.release-gate.outputs.release == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'cipherstash/envelopers'
    runs-on: ubuntu-latest
    # No concurrency group, unlike release-pr: GitHub keeps only one pending run
    # per group and would drop the run that publishes a just-merged release PR.
    environment: release
    # release-plz uses the GitHub App token, so the default token stays read-only.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      # Review the action SHA and CLI version together when upgrading. The action
      # otherwise installs the latest CLI, which would make releases non-reproducible.
      - name: Publish release
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

  release-pr:
    name: "Release-plz PR"
    if: github.repository == 'cipherstash/envelopers'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      # Review the action SHA and CLI version together when upgrading. The action
      # otherwise installs the latest CLI, which would make releases non-reproducible.
      - name: Open or update release PR
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
